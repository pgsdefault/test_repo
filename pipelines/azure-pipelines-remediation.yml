# ==================== AZURE PIPELINES - REMEDIATION ====================
# Purpose: Deploy policy remediation tasks on non-compliant resources
# Triggered by: Changes in policy_remediation.tf and policy_remediations.auto.tfvars
# State File: remediation.tfstate
# Dependencies: Policy Deployment Pipeline MUST complete successfully first
# Order: This runs AFTER policy deployment completes

trigger:
- main
pool:
  vmImage: 'ubuntu-latest'

variables:
- group: Azure_Policy_Demo
- name: TF_VERSION
  value: '1.6.0'

- name: TF_ROOT
  value: '$(System.DefaultWorkingDirectory)/terraform/remediation'

stages:
  # ==================== VALIDATION STAGE ====================
  - stage: ValidatePolicyState
    displayName: 'Validate Policy Deployment State'
    jobs:
      - job: CheckPolicyDeployment
        displayName: 'Check Policy State Alignment'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
              addToPath: true
            displayName: 'Setup Python'

          - script: |
              pip install azure-cli azure-identity
            displayName: 'Install Dependencies'

          - script: |
              python3 scripts/validators/check_policy_state.py
            displayName: 'Validate Policy Deployment Completed'
            env:
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)
            continueOnError: false

  # ==================== DEPLOYMENT STAGE ====================
  - stage: DeployRemediation
    displayName: 'Deploy Remediation Tasks'
    dependsOn: ValidatePolicyState
    condition: succeeded()
    jobs:
      - job: TerraformRemediation
        displayName: 'Terraform Plan & Apply - Remediation'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'
              addToPath: true
            displayName: 'Setup Python'

          - script: |
              curl -sL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
              sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
              sudo apt-get update && sudo apt-get install -y terraform=$(TF_VERSION)*
            displayName: 'Install Terraform'

          - script: |
              terraform --version
              echo "Terraform Root: $(TF_ROOT)"
            displayName: 'Verify Terraform Installation'

          # ==================== TERRAFORM INIT ====================
          - script: |
              cd $(TF_ROOT)
              terraform init -input=false -upgrade \
                -backend-config="key=remediation.tfstate"
            displayName: 'Terraform Init - Remediation'
            env:
              TF_LOG: 'INFO'
              TF_LOG_PATH: '$(System.DefaultWorkingDirectory)/tf_init_remediation.log'
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)

          - script: |
              cd $(TF_ROOT)
              terraform validate
            displayName: 'Terraform Validate - Remediation'
            env:
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)

          # ==================== TERRAFORM PLAN ====================
          - script: |
              cd $(TF_ROOT)
              terraform plan -out=tfplan \
                -lock=true \
                -lock-timeout=10m \
                -input=false
            displayName: 'Terraform Plan - Remediation'
            env:
              TF_LOG: 'INFO'
              TF_LOG_PATH: '$(System.DefaultWorkingDirectory)/tf_plan_remediation.log'
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)

          # ==================== TERRAFORM APPLY ====================
          - script: |
              cd $(TF_ROOT)
              terraform apply -auto-approve -lock=true tfplan
            displayName: 'Terraform Apply - Remediation'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/TF_AzurePolicy_DEMO'))
            # condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              TF_LOG: 'INFO'
              TF_LOG_PATH: '$(System.DefaultWorkingDirectory)/tf_apply_remediation.log'
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)

          # ==================== EXPORT STATE ====================
          - script: |
              cd $(TF_ROOT)
              terraform state pull > $(System.DefaultWorkingDirectory)/remediation.tfstate
              terraform output -json > $(System.DefaultWorkingDirectory)/remediation_outputs.json
            displayName: 'Export Terraform State & Outputs'
            condition: always()
            env:
              ARM_CLIENT_ID: $(client_id)
              ARM_CLIENT_SECRET: $(client_secret)
              ARM_SUBSCRIPTION_ID: $(subscription_id)
              ARM_TENANT_ID: $(tenant_id)

          # ==================== PUBLISH ARTIFACTS ====================
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/remediation_outputs.json'
              artifact: 'Remediation-Outputs'
            displayName: 'Publish Remediation Outputs'
            condition: always()

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tf_plan_remediation.log'
              artifact: 'Remediation-Plan-Logs'
            displayName: 'Publish Remediation Plan Logs'
            condition: always()

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tf_apply_remediation.log'
              artifact: 'Remediation-Apply-Logs'
            displayName: 'Publish Remediation Apply Logs'
            condition: always()
